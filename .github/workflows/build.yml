name: Build MakuTweaker++

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update build number
        shell: pwsh
        run: ./scripts/UpdateBuildNumber.ps1

      - name: Configure and build Release
        run: cmake --workflow --preset release

      - name: Copy output for artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_output | Out-Null
          Copy-Item -Recurse build/Release/* build_output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MakuTweaker++-Release
          path: build_output/
